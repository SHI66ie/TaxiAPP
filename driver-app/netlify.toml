# Netlify configuration for the TaxiAPP Driver Platform
# Deploy this as a SEPARATE Netlify site pointing to the driver-app subdirectory

[build]
  base = "driver-app"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback so React Router client routes work
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: proxy API calls to backend (Railway / Render / local tunnel)
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-url.com/api/:splat"
#   status = 200
#   force = true
